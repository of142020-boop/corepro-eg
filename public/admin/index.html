<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Core Pro CMS - لوحة إدارة المحتوى</title>
  <!-- No Netlify Identity - We will use GitHub Proxy if needed -->
</head>
<body>
  <!-- Decap CMS Script -->
  <script>
    window.CMS_MANUAL_INIT = true;
  </script>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  
  <script>
    // ✅ Init Decap CMS with GitHub Backend
    CMS.init({
      config: {
        backend: {
          name: 'github',
          repo: 'of142020-boop/corepro-eg',
          branch: 'main',
          // base_url: 'https://corepro-eg.vercel.app', // TODO: Add your OAuth Proxy URL here
          // auth_endpoint: 'api/auth'
        },
        local_backend: true, // Allow working locally with npx decap-cms-proxy-server
        publish_mode: 'editorial_workflow',
        media_folder: 'public/images/blog',
        public_folder: '/images/blog',
        site_url: 'https://corepro-eg.com',
        display_url: 'https://corepro-eg.com',
        logo_url: '/logo-header-116x154.webp',
        i18n: {
          structure: 'single_file',
          locales: ['ar'],
          default_locale: 'ar'
        },
        collections: [
          {
            name: 'blog',
            label: 'المقالات (Blog)',
            label_singular: 'مقال',
            folder: 'src/content/blog',
            create: true,
            slug: '{{slug}}',
            editor: { preview: false },
            fields: [
              { label: 'العنوان الرئيسي', name: 'title', widget: 'string', i18n: true },
              { label: 'تاريخ النشر', name: 'pubDate', widget: 'datetime', format: 'YYYY-MM-DD', date_format: 'YYYY-MM-DD', time_format: false, i18n: true },
              { label: 'وصف المختصر (Excerpt/SEO)', name: 'description', widget: 'text', i18n: true },
              { label: 'الصورة الرئيسية', name: 'heroImage', widget: 'image', choose_url: false },
              { label: 'التصنيف', name: 'category', widget: 'select', options: ['تخريم بالكور', 'قص بالمنشار', 'واير خرسانة', 'شفاطات وتأسيس'] },
              { label: 'المحتوى', name: 'body', widget: 'markdown', i18n: true }
            ]
          }
        ]
      }
    });
  </script>
</body>
</html>
